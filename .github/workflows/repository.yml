name: Repository CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: vinoguessr/.github/.github/workflows/reusable-repository.yml@38adaa6afdfb7df020feb2a7ff93a6ddf1d79af8
    permissions:
      contents: read
  swift:
    uses: vinoguessr/.github/.github/workflows/reusable-swift.yml@38adaa6afdfb7df020feb2a7ff93a6ddf1d79af8
    permissions:
      contents: read
